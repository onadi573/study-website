<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"
    <title>Study Website</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-slate-100 min-h-screen p-6">

<div class="max-w-4xl mx-auto space-y-6"

  <h1 class="text-3x1 font-bold text-center"> Study App </h1>

  <div class="bg-white p-4 rounded-x1 shadow">
    <h2 class="font-semibold mb-2"> Daily Study Goal </h2>
    <input id="goalInput" type="text" placeholder="e.g. Study for Math Test"
        class="border p-2 rounded w-32" />
    <button onclick="setGoal()" class="ml-2 bg-blue-600 text-white px-3 py-3 rounded">
      Set Goal
    </button>
    <p id="goalStatus" class="mt-2 text-sm text-grey-600"></p>
    <div


  <div class="bg-white p-4 rounded-x1 shadow">
    <h2 class="font-semibold mb-2"> Upcoming </h2>

  <div class="flex gap-2 mb-3">
    <input id="taskInput" type="text" placeholder="Homework"
      class="flex-1 border p-2 rounded"/>
  <button onclick="addHomework()" class="bg-green-600 text-white px-4 rounded">
    Add
  </button>




  </div>




  </div>
